    <!-- Pretendard(SIL OFL) — 쓰는 글자만 받아 오는 dynamic subset. 못 받아도 아이폰 기본 글꼴로 보인다 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <title>멍케어</title>
    <style>
      /* 앱을 켜는 순간(CSS·스크립트가 오기 전)부터 바탕을 연한 파랑으로 — 흰 화면이 번쩍이지 않게 */
      html { background: #eef5ff; }
      /* 스플래시: React가 뜨기 전, HTML이 오자마자 바로 보이도록 여기(인라인)에 둔다 */
      #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 24px; background: #eef5ff; text-align: center; transition: opacity 0.4s ease;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
      #splash > * { animation: splash-in 0.35s ease-out backwards; }
      @keyframes splash-in { from { opacity: 0; transform: translateY(6px); } }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 6px 18px rgba(75, 144, 226, 0.25); margin-bottom: 30px; }
      #splash h1 { margin: 0 0 14px; font-size: 26px; font-weight: 800; color: #24456b; letter-spacing: -0.02em; }
      #splash p { margin: 0 0 22px; font-size: 16px; color: #607d9b; }
      #splash small { font-size: 12px; letter-spacing: 0.14em; color: #7d93ad; }
      /* 다크 모드(설정에서 켬): 첫 화면부터 어둡게 */
      html[data-theme="dark"], html[data-theme="dark"] #splash { background: #17171c; }
      html[data-theme="dark"] #splash h1 { color: #ececf0; }
      html[data-theme="dark"] #splash p { color: #a9a9b3; }
      html[data-theme="dark"] #splash small { color: #8dbdf6; }
    </style>
    <script>
      // 다크 모드면 그리기 전에 먼저 입힌다(밝은 화면이 번쩍이지 않게) — 같은 키를 src/services/themeSettings.js가 쓴다
      try {
        if (localStorage.getItem("dogcare-theme-v1") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#17171c");
        }
        // 배경 테마(색 조합·발바닥) — src/services/themeSettings.js applyColor와 같은 규칙
        var c = (localStorage.getItem("dogcare-color-v1") || "").split("-");
        if (c[0]) document.documentElement.setAttribute("data-color", c[0]);
        if (c[1]) document.documentElement.setAttribute("data-paw", "");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="splash" aria-hidden="true">

      <h1>우리 강아지를 위한 맞춤 AI</h1>
      <p>우리 아이에게 꼭 필요한 케어를 한눈에.</p>
      <small>YOUR DOG, YOUR CARE</small>
    </div>

    <script type="module" src="/src/main.jsx"></script>
