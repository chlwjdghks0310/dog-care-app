    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8f0" />
    <!-- Pretendard(SIL OFL) — 쓰는 글자만 받아 오는 dynamic subset. 못 받아도 아이폰 기본 글꼴로 보인다 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <title>멍케어</title>
    <style>
      /* 앱을 켜는 순간(CSS·스크립트가 오기 전)부터 바탕을 크림색으로 — 흰 화면이 번쩍이지 않게 */
      html { background: #fff8f0; }
      /* 스플래시: React가 뜨기 전, HTML이 오자마자 바로 보이도록 여기(인라인)에 둔다 */
      #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 24px; background: #fff8f0; text-align: center; transition: opacity 0.4s ease;
        font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 6px 18px rgba(201, 74, 69, 0.22); margin-bottom: 30px; }
      #splash h1 { margin: 0 0 14px; font-size: 26px; font-weight: 800; color: #3a2e2a; letter-spacing: -0.02em; }
      #splash p { margin: 0 0 22px; font-size: 16px; color: #7a6b63; }
      #splash small { font-size: 12px; letter-spacing: 0.14em; color: #80726a; }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <img src="/icon-512.png?v=4" alt="" />
      <h1>우리 강아지를 위한 맞춤 AI</h1>
      <p>우리 아이에게 꼭 필요한 케어를 한눈에.</p>
      <small>YOUR DOG, YOUR CARE</small>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
