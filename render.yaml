services:
  # 실제 배포명은 Render 대시보드에서 수동으로 두 서비스를 만들 때 정해졌다(Blueprint 미사용):
  # 백엔드 = https://dog-care-app.onrender.com, 프론트엔드 = https://dog-care-app-1.onrender.com
  - type: web
    name: dogcare-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # 프론트엔드(앱 화면) — 와이파이 상관없이 다른 사람도 이 주소로 접속할 수 있게 해주는 부분.
  - type: web
    name: dogcare-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://dog-care-app.onrender.com
