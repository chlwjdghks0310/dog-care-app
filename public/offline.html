<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f0f6ff" />
  <title>멍케어 · 인터넷 연결 없음</title>
  <!-- 인터넷 없이 앱을 열면 서비스워커(sw.js)가 이 페이지를 대신 보여 준다. 외부 파일 없이 혼자 열려야 해서 스타일·아이콘도 여기 둔다.
       색은 앱(src/index.css)과 같은 값, 다크 모드는 앱 설정(dogcare-theme-v1)을 따른다. 아이콘은 앱과 같은 Lucide 선 아이콘. -->
  <script>
    try {
      if (localStorage.getItem("dogcare-theme-v1") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
        document.querySelector('meta[name="theme-color"]').setAttribute("content", "#17171c");
      }
    } catch (e) {}
  </script>
  <style>
    :root { --bg: #f0f6ff; --surface: #fff; --border: #d6e4f5; --text: #2b2320; --soft: #7a6f63; --accent: #4b90e2; --accent-soft: #dde9fa; --accent-strong: #2f6fbd; --teal: #1d7673; --teal-bg: #d9f1ef; --shadow: 0 4px 14px rgba(43, 35, 32, 0.07); }
    :root[data-theme="dark"] { --bg: #17171c; --surface: #222229; --border: #33333d; --text: #ececf0; --soft: #a9a9b3; --accent: #5b9ff0; --accent-soft: #1f2d42; --accent-strong: #8dbdf6; --teal: #4fc3bf; --teal-bg: #1f3a3a; --shadow: 0 4px 16px rgba(0, 0, 0, 0.35); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { word-break: keep-all; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; display: flex; align-items: center; justify-content: center; padding: calc(env(safe-area-inset-top) + 24px) 18px calc(env(safe-area-inset-bottom) + 24px); }
    main { width: 100%; max-width: 380px; text-align: center; }
    svg { display: block; }
    .bubble { position: relative; display: inline-block; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 12px 18px; font-weight: 700; line-height: 1.5; box-shadow: var(--shadow); }
    .bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 14px; height: 14px; background: var(--surface); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); transform: translateX(-50%) rotate(45deg); }
    .hero { position: relative; width: 112px; height: 112px; margin: 22px auto 12px; border-radius: 34px; background: var(--accent-soft); color: var(--accent-strong); display: flex; align-items: center; justify-content: center; }
    .hero .dog { animation: sniff 2.4s ease-in-out infinite; }
    .badge { position: absolute; right: -6px; bottom: -6px; width: 40px; height: 40px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); color: var(--soft); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); }
    @keyframes sniff { 0%, 100% { transform: translateX(0) rotate(0); } 25% { transform: translateX(-6px) rotate(-6deg); } 75% { transform: translateX(6px) rotate(6deg); } }
    @media (prefers-reduced-motion: reduce) { .hero .dog { animation: none; } }
    h1 { font-size: 22px; font-weight: 800; margin: 8px 0 8px; letter-spacing: -0.02em; }
    p { color: var(--soft); line-height: 1.6; margin: 0; font-size: 15px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 22px; padding: 6px 16px; margin: 20px 0 16px; text-align: left; box-shadow: var(--shadow); }
    .row { display: flex; gap: 12px; align-items: center; padding: 12px 0; font-size: 14px; line-height: 1.55; }
    .row + .row { border-top: 1px solid var(--border); }
    .ico { flex-shrink: 0; width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent-strong); }
    .ico.teal { background: var(--teal-bg); color: var(--teal); }
    button { width: 100%; min-height: 52px; border: none; border-radius: 16px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 800; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 6px 16px rgba(75, 144, 226, 0.28); }
    .small { color: var(--soft); font-size: 12.5px; margin-top: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="bubble">킁킁… 인터넷 냄새가 안 나!<br />금방 다시 찾아올게</div>
    <div class="hero" aria-hidden="true">
      <svg class="dog" width="62" height="62" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11.25 16.25h1.5L12 17z"/><path d="M16 14v.5"/><path d="M4.42 11.247A13.152 13.152 0 0 0 4 14.556C4 18.728 7.582 21 12 21s8-2.272 8-6.444a11.702 11.702 0 0 0-.493-3.309"/><path d="M8 14v.5"/><path d="M8.5 8.5C8.116 9.55 7.417 10.528 6.156 11C4.225 11.722 2.58 10.703 2.5 10C2.387 9.006 3.677 3.47 6.5 3C8.423 2.679 10.151 3.845 10.151 5.235"/><path d="M10.151 5.235A7.497 7.497 0 0 1 14 5.277"/><path d="M14 5.277C14 3.887 15.844 2.679 17.767 3C20.59 3.47 21.88 9.006 21.767 10C21.687 10.703 20.042 11.722 18.111 11C16.85 10.528 16.256 9.55 15.872 8.5"/></svg>
      <span class="badge">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/></svg>
      </span>
    </div>
    <h1>인터넷이 연결되지 않았어요</h1>
    <p>와이파이나 모바일 데이터가 켜져 있는지 확인해 주세요.</p>
    <div class="card">
      <div class="row">
        <span class="ico teal" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
        <span>기록은 이 폰에 그대로 있어요. 연결되면 바로 이어서 쓸 수 있고, 로그인했다면 백업도 자동으로 다시 해요.</span>
      </div>
      <div class="row">
        <span class="ico" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2v2"/><path d="M5 2v2"/><path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1"/><path d="M8 15a6 6 0 0 0 12 0v-3"/><circle cx="20" cy="10" r="2"/></svg></span>
        <span>강아지가 많이 아파 보이면 연결을 기다리지 말고 가까운 동물병원에 바로 전화해 주세요.</span>
      </div>
    </div>
    <button type="button" onclick="location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8M21 3v5h-5M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16M8 16H3v5"/></svg>
      다시 시도
    </button>
    <p class="small">연결되면 자동으로 다시 열려요.</p>
  </main>
  <script>
    window.addEventListener("online", () => location.reload());
  </script>
</body>
</html>
